{% extends 'sop_portal/base.html' %}{% block content %}<h1>Sosialisasi Mandiri</h1><form><label>Pilih Tema</label><select name="theme" onchange="this.form.submit()"><option value="">Semua Tema</option>{% for theme in themes %}<option {% if selected_theme == theme %}selected{% endif %}>{{ theme }}</option>{% endfor %}</select></form><div class="grid">{% for doc in documents %}<a class="panel" href="{% url 'training:read_document' doc.pk %}"><h3>{{ doc.title }}</h3><p>{{ doc.theme }}</p><small>Berlaku sampai {{ doc.valid_until }}</small></a>{% empty %}<p>Tidak ada materi aktif.</p>{% endfor %}</div>{% endblock %}
