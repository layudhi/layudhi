{% extends 'sop_portal/base.html' %}{% block content %}<h1>{{ document.title }}</h1><p>{{ document.description }}</p><div class="reader" id="reader"><iframe src="{{ document.file.url }}"></iframe><div class="fallback"><a href="{{ document.file.url }}" target="_blank">Buka file di tab baru</a></div></div><form method="post" action="{% url 'training:complete_reading' document.pk %}">{% csrf_token %}<button id="complete" disabled>Saya sudah membaca sampai selesai</button></form><script>const reader=document.getElementById('reader');const btn=document.getElementById('complete');reader.addEventListener('scroll',()=>{if(reader.scrollTop+reader.clientHeight>=reader.scrollHeight-10){btn.disabled=false;}});setTimeout(()=>{if(reader.scrollHeight<=reader.clientHeight+10) btn.disabled=false;},800);</script>{% endblock %}
